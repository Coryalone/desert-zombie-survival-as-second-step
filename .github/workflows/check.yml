name: Flutter checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: dart tool/prepare.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - name: Browser smoke checks
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-check" playwright@1.56.1 pngjs@7.0.0
          export NODE_PATH="$RUNNER_TEMP/ui-check/node_modules"
          "$RUNNER_TEMP/ui-check/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/web > /tmp/highway-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tool/browser_check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: build/browser-check/
      - run: flutter build apk --release
      - name: Check packaged permissions
        shell: bash
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk > permissions.txt
          cat permissions.txt
          if grep -q "uses-permission:" permissions.txt; then
            echo "Unexpected application permission"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desert-highway-prototype
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/
            pubspec.lock
            permissions.txt
